name: Flutter CI

on:
  push:
    branches: [main, 'feature/**']
  pull_request:
    branches: [main]

jobs:
  analyze-test-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Android platform shell
        run: flutter create . --platforms=android --org=com.tether --project-name=tether

      - name: Configure Android core library desugaring
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('android/app/build.gradle.kts')
          text = path.read_text()
          if 'isCoreLibraryDesugaringEnabled = true' not in text:
              text = text.replace(
                  'compileOptions {\n',
                  'compileOptions {\n        isCoreLibraryDesugaringEnabled = true\n',
                  1,
              )
          if 'coreLibraryDesugaring("com.android.tools:desugar_jdk_libs:2.1.5")' not in text:
              text += '\n\ndependencies {\n    coreLibraryDesugaring("com.android.tools:desugar_jdk_libs:2.1.5")\n}\n'
          path.write_text(text)
          PY

      - name: Remove generated template test
        run: rm -f test/widget_test.dart

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      - name: Build Android APK
        run: flutter build apk --debug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: tether-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
